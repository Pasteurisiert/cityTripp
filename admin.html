<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityTripp - Admin & Geocoder</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #f4f4f9; color: #1c1c1e; }
    .container { max-width: 720px; margin: 0 auto; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #2c3e50; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    button { background: #007aff; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-right: 6px; margin-bottom: 6px; }
    button.danger { background: #ff3b30; }
    button.commit { background: #34c759; font-size: 15px; width: 100%; padding: 12px; }
    button:disabled { background: #a2a2a7; cursor: not-allowed; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .status-msg { font-size: 13px; margin-top: 6px; font-weight: 500; }
    .status-success { color: #34c759; }
    .status-error { color: #ff3b30; }
    .status-info { color: #007aff; }
  </style>
</head>
<body>
<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <h2>CityTripp Admin</h2>
    <a href="index.html" style="color:#007aff; text-decoration:none; font-weight:600;">Zur Routen-App →</a>
  </div>

  <!-- 1. GitHub Setup -->
  <div class="card">
    <h3>1. GitHub Verbindung</h3>
    <div class="row">
      <div>
        <label>Benutzername / Organisation:</label>
        <input type="text" id="ghOwner" placeholder="z.B. maxmustermann">
      </div>
      <div>
        <label>Repository Name:</label>
        <input type="text" id="ghRepo" placeholder="z.B. cityTripp">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Pfad zur JSON-Datei im Repo:</label>
        <input type="text" id="ghPath" value="trips.json" placeholder="trips.json oder cityTripp/trips.json">
      </div>
      <div>
        <label>Branch:</label>
        <input type="text" id="ghBranch" value="main" placeholder="main">
      </div>
    </div>
    <label>GitHub Personal Access Token (PAT):</label>
    <input type="password" id="ghToken" placeholder="github_pat_... oder ghp_...">
    <button onclick="saveAndLoad()">💾 Einstellungen speichern & trips.json laden</button>
    <div id="ghStatus" class="status-msg"></div>
  </div>

  <!-- 2. Städteauswahl -->
  <div class="card">
    <h3>2. Stadt wählen / anlegen</h3>
    <label>Aktive Stadt:</label>
    <select id="citySelect" onchange="onCityChange()"></select>
    
    <div class="row">
      <div>
        <input type="text" id="newCityName" placeholder="Neue Stadt hinzufügen (z.B. Dublin)">
      </div>
      <div style="flex: 0 0 auto;">
        <button onclick="addCity()">+ Stadt anlegen</button>
        <button class="danger" onclick="deleteCurrentCity()">Stadt entfernen</button>
      </div>
    </div>
  </div>

  <!-- 3. Sehenswürdigkeit suchen -->
  <div class="card">
    <h3>3. Sehenswürdigkeit hinzufügen (Automatische Koordinaten)</h3>
    <label>Name der Sehenswürdigkeit:</label>
    <div class="row">
      <div>
        <input type="text" id="poiQuery" placeholder="z.B. Trinity College oder St Patrick's Cathedral">
      </div>
      <div style="flex: 0 0 auto;">
        <button id="searchBtn" onclick="searchAndAddPoi()">🔍 Suchen & Hinzufügen</button>
      </div>
    </div>
    <div id="geoStatus" class="status-msg"></div>
  </div>

  <!-- 4. Liste -->
  <div class="card">
    <h3>Orte der ausgewählten Stadt</h3>
    <ul id="poiList"></ul>
  </div>

  <!-- 5. Commit -->
  <div class="card">
    <h3>4. Änderungen auf GitHub übertragen</h3>
    <button id="commitBtn" class="commit" onclick="commitToGitHub()">🚀 Direkt nach GitHub committen</button>
    <div id="commitStatus" class="status-msg"></div>
  </div>
</div>

<script>
  let tripsData = { cities: [] };
  let currentFileSha = null;
  let activeCityId = null;

  // Lade gespeicherte Werte
  document.getElementById('ghOwner').value = localStorage.getItem('cityTripp_ghOwner') || '';
  document.getElementById('ghRepo').value = localStorage.getItem('cityTripp_ghRepo') || '';
  document.getElementById('ghPath').value = localStorage.getItem('cityTripp_ghPath') || 'trips.json';
  document.getElementById('ghBranch').value = localStorage.getItem('cityTripp_ghBranch') || 'main';
  document.getElementById('ghToken').value = localStorage.getItem('cityTripp_ghToken') || '';

  function cleanInputs() {
    let owner = document.getElementById('ghOwner').value.trim();
    let repo = document.getElementById('ghRepo').value.trim();
    let path = document.getElementById('ghPath').value.trim() || 'trips.json';
    let branch = document.getElementById('ghBranch').value.trim() || 'main';
    let token = document.getElementById('ghToken').value.trim();

    // Bereinige versehentlich eingefügte URLs
    owner = owner.replace('https://github.com/', '').replace('/', '');
    repo = repo.replace('https://github.com/', '');
    
    if (repo.includes('/')) {
      const parts = repo.split('/');
      if (!owner) owner = parts[0];
      repo = parts[1];
    }

    document.getElementById('ghOwner').value = owner;
    document.getElementById('ghRepo').value = repo;
    document.getElementById('ghPath').value = path;
    document.getElementById('ghBranch').value = branch;

    return { owner, repo, path, branch, token };
  }

  function saveAndLoad() {
    const cfg = cleanInputs();
    localStorage.setItem('cityTripp_ghOwner', cfg.owner);
    localStorage.setItem('cityTripp_ghRepo', cfg.repo);
    localStorage.setItem('cityTripp_ghPath', cfg.path);
    localStorage.setItem('cityTripp_ghBranch', cfg.branch);
    localStorage.setItem('cityTripp_ghToken', cfg.token);
    fetchTripsFromGitHub();
  }

  function getAuthHeaders(token) {
    const headers = { 'Accept': 'application/vnd.github.v3+json' };
    if (token) {
      // Funktioniert sowohl für github_pat_ als auch klassische Tokens
      headers['Authorization'] = `Bearer ${token}`;
    }
    return headers;
  }

  async function fetchTripsFromGitHub() {
    const cfg = cleanInputs();
    const status = document.getElementById('ghStatus');

    if (!cfg.owner || !cfg.repo) {
      status.innerHTML = '<span class="status-error">Bitte Benutzername und Repository-Name eingeben.</span>';
      return;
    }

    status.innerHTML = `<span class="status-info">Lade ${cfg.path} von ${cfg.owner}/${cfg.repo} (${cfg.branch})...</span>`;

    try {
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}&t=${Date.now()}`;
      const res = await fetch(url, { headers: getAuthHeaders(cfg.token) });

      if (res.status === 404) {
        status.innerHTML = '<span class="status-info">Datei existiert noch nicht im Repo. Erstelle leere Vorlage.</span>';
        tripsData = { cities: [{ id: "cork", name: "Cork", pois: [] }] };
        currentFileSha = null;
      } else if (res.ok) {
        const data = await res.json();
        currentFileSha = data.sha;
        const rawContent = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        tripsData = JSON.parse(rawContent);
        status.innerHTML = `<span class="status-success">✓ ${cfg.path} erfolgreich von GitHub geladen.</span>`;
      } else {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `HTTP Fehler ${res.status}`);
      }
      activeCityId = tripsData.cities[0] ? tripsData.cities[0].id : null;
      render();
    } catch (err) {
      status.innerHTML = `<span class="status-error">Fehler: ${err.message}</span>`;
    }
  }

  async function searchAndAddPoi() {
    const activeCity = tripsData.cities.find(c => c.id === activeCityId);
    if (!activeCity) { alert("Bitte zuerst eine Stadt auswählen."); return; }

    const query = document.getElementById('poiQuery').value.trim();
    if (!query) return;

    const geoStatus = document.getElementById('geoStatus');
    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    geoStatus.innerHTML = `<span class="status-info">Suche Koordinaten für "${query}" in ${activeCity.name}...</span>`;

    try {
      const fullQuery = `${query}, ${activeCity.name}`;
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullQuery)}&limit=1`;
      
      const res = await fetch(url, { headers: { 'Accept-Language': 'de,en' } });
      const results = await res.json();

      if (!results || results.length === 0) {
        geoStatus.innerHTML = `<span class="status-error">Keine Koordinaten gefunden. Bitte Namen genauer angeben.</span>`;
        btn.disabled = false;
        return;
      }

      const match = results[0];
      const newPoi = {
        id: Date.now(),
        name: query,
        lat: parseFloat(match.lat),
        lng: parseFloat(match.lon),
        visited: false
      };

      activeCity.pois.push(newPoi);
      geoStatus.innerHTML = `<span class="status-success">✓ Gefunden: ${match.display_name.split(',')[0]} (${newPoi.lat.toFixed(4)}, ${newPoi.lng.toFixed(4)})</span>`;
      document.getElementById('poiQuery').value = '';
      render();
    } catch (err) {
      geoStatus.innerHTML = `<span class="status-error">Geocoding-Fehler: ${err.message}</span>`;
    } finally {
      btn.disabled = false;
    }
  }

  async function commitToGitHub() {
    const cfg = cleanInputs();
    const status = document.getElementById('commitStatus');
    const btn = document.getElementById('commitBtn');

    if (!cfg.token) {
      alert("Bitte tragen Sie unter Punkt 1 Ihr GitHub Personal Access Token (PAT) ein.");
      return;
    }

    btn.disabled = true;
    status.innerHTML = '<span class="status-info">Sende Commit an GitHub...</span>';

    try {
      // 1. Neuesten SHA abfragen
      const getUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}&t=${Date.now()}`;
      const getRes = await fetch(getUrl, { headers: getAuthHeaders(cfg.token) });
      if (getRes.ok) {
        const fileInfo = await getRes.json();
        currentFileSha = fileInfo.sha;
      }

      // 2. Base64 UTF-8 Encodierung
      const jsonStr = JSON.stringify(tripsData, null, 2);
      const encodedContent = btoa(unescape(encodeURIComponent(jsonStr)));

      // 3. PUT Request
      const bodyPayload = {
        message: `Update ${cfg.path} via CityTripp Admin [${new Date().toLocaleTimeString()}]`,
        content: encodedContent,
        branch: cfg.branch
      };
      if (currentFileSha) bodyPayload.sha = currentFileSha;

      const putUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
      const putRes = await fetch(putUrl, {
        method: 'PUT',
        headers: {
          ...getAuthHeaders(cfg.token),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(bodyPayload)
      });

      if (!putRes.ok) {
        const errData = await putRes.json().catch(() => ({}));
        throw new Error(errData.message || `HTTP ${putRes.status}`);
      }

      const commitResult = await putRes.json();
      currentFileSha = commitResult.content.sha;
      status.innerHTML = `<span class="status-success">✓ Erfolgreich committet! (Commit: ${commitResult.commit.sha.substring(0, 7)})</span>`;
    } catch (err) {
      status.innerHTML = `<span class="status-error">Commit fehlgeschlagen: ${err.message}</span>`;
    } finally {
      btn.disabled = false;
    }
  }

  function render() {
    const select = document.getElementById('citySelect');
    select.innerHTML = '';
    tripsData.cities.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      if (c.id === activeCityId) opt.selected = true;
      select.appendChild(opt);
    });

    const list = document.getElementById('poiList');
    list.innerHTML = '';
    const city = tripsData.cities.find(c => c.id === activeCityId);
    if (!city || city.pois.length === 0) {
      list.innerHTML = '<li><em>Keine Orte eingetragen.</em></li>';
      return;
    }

    city.pois.forEach((poi, index) => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span><strong>${index + 1}. ${poi.name}</strong> (${poi.lat.toFixed(4)}, ${poi.lng.toFixed(4)})</span>
        <button class="danger" onclick="deletePoi(${poi.id})">Entfernen</button>
      `;
      list.appendChild(li);
    });
  }

  function onCityChange() {
    activeCityId = document.getElementById('citySelect').value;
    render();
  }

  function addCity() {
    const name = document.getElementById('newCityName').value.trim();
    if (!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
    tripsData.cities.push({ id: id, name: name, pois: [] });
    activeCityId = id;
    document.getElementById('newCityName').value = '';
    render();
  }

  function deleteCurrentCity() {
    if (!confirm("Stadt und alle enthaltenen Orte wirklich löschen?")) return;
    tripsData.cities = tripsData.cities.filter(c => c.id !== activeCityId);
    activeCityId = tripsData.cities.length > 0 ? tripsData.cities[0].id : null;
    render();
  }

  function deletePoi(id) {
    const city = tripsData.cities.find(c => c.id === activeCityId);
    if (city) {
      city.pois = city.pois.filter(p => p.id !== id);
      render();
    }
  }

  // Automatischer Start bei gespeicherten Daten
  if (document.getElementById('ghOwner').value && document.getElementById('ghRepo').value) {
    fetchTripsFromGitHub();
  }
</script>
</body>
</html>
