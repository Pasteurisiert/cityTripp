<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityTripp - Routen-Assistent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #f4f4f9; color: #1c1c1e; }
    .container { max-width: 700px; margin: 0 auto; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    h2, h3 { margin-top: 0; color: #2c3e50; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; font-weight: 600; margin-bottom: 12px; background: #fff; }
    button { background: #007aff; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-right: 6px; margin-bottom: 6px; }
    button.secondary { background: #e5e5ea; color: #1c1c1e; }
    button.success { background: #34c759; }
    button.small { padding: 4px 8px; font-size: 12px; margin-right: 4px; margin-bottom: 0; }
    button.toggle-active { background: #34c759; color: white; }
    button.toggle-inactive { background: #8e8e93; color: white; }
    button.danger-small { background: #ff3b30; color: white; padding: 4px 8px; font-size: 12px; margin-right: 0; margin-bottom: 0; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 12px 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
    li.start-item { background: #eef7ee; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1.5px solid #34c759; }
    li.start-endpoint { background: #f0f7ff; border-radius: 8px; padding: 12px; margin-top: 10px; border: 1.5px solid #007aff; }
    li.disabled-item { background: #f9f9fa !important; border: 1.5px dashed #c7c7cc !important; opacity: 0.6; }
    li.disabled-item strong { text-decoration: line-through; color: #8e8e93; }
    .visited { text-decoration: line-through; color: #8e8e93; }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #007aff; color: white; font-weight: 600; margin-left: 6px; }
    .badge-disabled { background: #8e8e93; color: white; }
    .nav-btn { text-decoration: none; display: inline-block; padding: 10px 14px; background: #5856d6; color: white; border-radius: 8px; font-size: 14px; font-weight: 600; text-align: center; }
    .metric-info { font-size: 12px; color: #666; margin-top: 4px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    a.admin-link { color: #007aff; text-decoration: none; font-size: 14px; font-weight: 600; }
    .action-group { display: flex; gap: 4px; align-items: center; }
  </style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h2>CityTripp</h2>
    <a href="admin.html" class="admin-link">⚙ Admin & Geocoder</a>
  </div>

  <div class="card">
    <label><strong>Aktuelle Stadt:</strong></label>
    <select id="citySelect" onchange="changeCity()"></select>
    
    <div>
      <button onclick="updatePosition()">📍 GPS aktualisieren</button>
      <button onclick="setStartPointHere()">🏨 Hier als Start/Ziel merken</button>
      <button class="secondary" onclick="optimizeRemainingRoute()">⚡ Route optimieren (TSP)</button>
    </div>
    <div id="status" style="margin-top: 8px; font-size: 13px; color: #555;">Standort: Initialisiere...</div>
  </div>

  <div class="card" id="next-suggestion">
    <h3>Nächster Halt</h3>
    <div id="suggestion-content">Berechne Fußwege...</div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">Geplante Stationen & Route</h3>
      <button class="secondary small" onclick="resetVisitedStatus()">Besuche zurücksetzen</button>
    </div>
    <ul id="poi-list" style="margin-top: 12px;"></ul>
  </div>
</div>

<script>
  let data = null;
  let activeCityId = null;
  let currentPos = null;
  let currentPosEnabled = true; // Toggle für aktuellen GPS-Startpunkt
  let startPoint = null; // Fester gemerkter Ausgangs-/Endpunkt
  let distanceCache = {};

  async function loadFromGitHub() {
    try {
      document.getElementById('status').innerText = "Lade trips.json frisch von GitHub...";
      const res = await fetch(`./trips.json?nocache=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error("trips.json nicht erreichbar");
      data = await res.json();
      
      data.cities.forEach(city => {
        city.pois.forEach(poi => {
          if (poi.enabled === undefined) poi.enabled = true;
        });
      });

      if (!activeCityId && data.cities.length > 0) {
        activeCityId = data.cities[0].id;
      }
      distanceCache = {};
      loadStartPointForCity();
      render();
      updatePosition();
    } catch (e) {
      document.getElementById('status').innerText = "Fehler beim Laden von trips.json.";
    }
  }

  function loadStartPointForCity() {
    const saved = localStorage.getItem(`cityTripp_startPoint_${activeCityId}`);
    if (saved) {
      startPoint = JSON.parse(saved);
      if (startPoint.enabled === undefined) startPoint.enabled = true;
    } else {
      startPoint = null;
    }
  }

  function saveStartPoint() {
    if (startPoint) {
      localStorage.setItem(`cityTripp_startPoint_${activeCityId}`, JSON.stringify(startPoint));
    } else {
      localStorage.removeItem(`cityTripp_startPoint_${activeCityId}`);
    }
  }

  function setStartPointHere() {
    if (!currentPos) {
      alert("GPS-Position noch nicht erfasst. Bitte kurz warten oder GPS aktivieren.");
      return;
    }
    const name = prompt("Name für Ausgangs-/Rückkehrpunkt (z. B. Hotel, Bahnhof):", "Mein Hotel / Ausgangspunkt");
    if (!name) return;

    startPoint = { name: name, lat: currentPos.lat, lng: currentPos.lng, enabled: true };
    saveStartPoint();
    document.getElementById('status').innerText = `Rückkehrpunkt gesetzt: "${name}"`;
    render();
  }

  function toggleStartPoint() {
    if (startPoint) {
      startPoint.enabled = !startPoint.enabled;
      saveStartPoint();
      render();
    }
  }

  function clearStartPoint() {
    startPoint = null;
    saveStartPoint();
    render();
  }

  function toggleCurrentPos() {
    currentPosEnabled = !currentPosEnabled;
    render();
  }

  function togglePoiEnabled(id) {
    const city = getActiveCity();
    const poi = city.pois.find(p => p.id === id);
    if (poi) {
      poi.enabled = (poi.enabled === undefined) ? false : !poi.enabled;
      render();
    }
  }

  function getActiveCity() {
    if (!data || !data.cities || data.cities.length === 0) return null;
    return data.cities.find(c => c.id === activeCityId) || data.cities[0];
  }

  function populateCitySelector() {
    const select = document.getElementById('citySelect');
    select.innerHTML = '';
    if (!data || !data.cities) return;
    data.cities.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      if (c.id === activeCityId) opt.selected = true;
      select.appendChild(opt);
    });
  }

  function changeCity() {
    activeCityId = document.getElementById('citySelect').value;
    loadStartPointForCity();
    const city = getActiveCity();
    if (city && city.pois.length > 0 && !currentPos) {
      currentPos = { lat: city.pois[0].lat, lng: city.pois[0].lng };
    }
    render();
  }

  function getManhattanDistance(lat1, lon1, lat2, lon2) {
    const latMid = ((lat1 + lat2) / 2) * (Math.PI / 180);
    const dy = Math.abs(lat2 - lat1) * 111139;
    const dx = Math.abs(lon2 - lon1) * 111139 * Math.cos(latMid);
    return Math.round(dx + dy);
  }

    async function getFootDistance(p1, p2) {
      if (!p1 || !p2) return { distance: 0, duration: 0, type: "N/A" };
      
      // Gleicher Punkt
      if (Math.abs(p1.lat - p2.lat) < 0.00001 && Math.abs(p1.lng - p2.lng) < 0.00001) {
        return { distance: 0, duration: 0, type: "Fußweg" };
      }
  
      const key = `${p1.lat.toFixed(5)},${p1.lng.toFixed(5)}_${p2.lat.toFixed(5)},${p2.lng.toFixed(5)}`;
      if (distanceCache[key] !== undefined) return distanceCache[key];
  
      // Fallback: Manhattan-/Luftlinie-Näherung berechnen
      const manhattan = getManhattanDistance(p1.lat, p1.lng, p2.lat, p2.lng);
      const fallback = { 
        distance: manhattan, 
        duration: Math.max(1, Math.round(manhattan / 80)), 
        type: "Näherung" 
      };
  
      // Timeout nach 1,8 Sekunden einbauen, damit die App niemals einfriert
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 1800);
  
      const url = `https://router.project-osrm.org/route/v1/foot/${p1.lng},${p1.lat};${p2.lng},${p2.lat}?overview=false`;
  
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        if (!response.ok) {
          // Bei HTTP 429 (Rate Limit) oder anderen Serverfehlern sofort Fallback nutzen
          distanceCache[key] = fallback;
          return fallback;
        }
  
        const res = await response.json();
        if (res.code === 'Ok' && res.routes && res.routes.length > 0) {
          const meters = Math.round(res.routes[0].distance);
          const durationMin = Math.max(1, Math.round(res.routes[0].duration / 60));
          const result = { distance: meters, duration: durationMin, type: "Fußweg" };
          distanceCache[key] = result;
          return result;
        }
      } catch (e) {
        // Bei Netzwerkfehler oder Timeout (AbortError) greift der Fallback
        clearTimeout(timeoutId);
      }
  
      distanceCache[key] = fallback;
      return fallback;
    }


  async function calculateTotalPathWithEnd(origin, route, endTarget) {
    let totalDist = 0;
    let totalDur = 0;
    let curr = origin;

    for (let point of route) {
      if (curr) {
        const metric = await getFootDistance(curr, point);
        totalDist += metric.distance;
        totalDur += metric.duration;
      }
      curr = point;
    }

    if (endTarget && curr) {
      const returnMetric = await getFootDistance(curr, endTarget);
      totalDist += returnMetric.distance;
      totalDur += returnMetric.duration;
    }

    return { totalDist, totalDur };
  }

  async function optimizeRemainingRoute() {
    const city = getActiveCity();
    const activeUnvisited = city.pois.filter(p => !p.visited && p.enabled !== false);
    const inactiveOrVisited = city.pois.filter(p => p.visited || p.enabled === false);

    if (activeUnvisited.length === 0) {
      alert("Keine aktiven, unbesuchten Stationen zum Optimieren ausgewählt.");
      return;
    }

    // Startet die Route am aktuellen GPS-Ort oder direkt beim ersten POI?
    const startOrigin = currentPosEnabled ? currentPos : null;
    const returnTarget = (startPoint && startPoint.enabled !== false) ? startPoint : null;

    document.getElementById('status').innerText = "Berechne globale Bestroute...";

    const allPoints = [];
    if (startOrigin) allPoints.push(startOrigin);
    allPoints.push(...activeUnvisited);
    if (returnTarget) allPoints.push(returnTarget);

    const prefetch = [];
    for (let i = 0; i < allPoints.length; i++) {
      for (let j = 0; j < allPoints.length; j++) {
        if (i !== j) prefetch.push(getFootDistance(allPoints[i], allPoints[j]));
      }
    }
    await Promise.all(prefetch);

    let bestOrder = [];
    let minTotalDistance = Infinity;

    if (activeUnvisited.length <= 8) {
      function permute(arr) {
        if (arr.length <= 1) return [arr];
        let result = [];
        for (let i = 0; i < arr.length; i++) {
          const current = arr[i];
          const remaining = arr.slice(0, i).concat(arr.slice(i + 1));
          for (let p of permute(remaining)) {
            result.push([current].concat(p));
          }
        }
        return result;
      }

      const allPermutations = permute(activeUnvisited);
      for (let route of allPermutations) {
        const origin = startOrigin || route[0];
        const subRoute = startOrigin ? route : route.slice(1);
        const { totalDist } = await calculateTotalPathWithEnd(origin, subRoute, returnTarget);
        if (totalDist < minTotalDistance) {
          minTotalDistance = totalDist;
          bestOrder = route;
        }
      }
    } else {
      let pool = [...activeUnvisited];
      let current = startOrigin || pool.shift();
      if (!startOrigin) bestOrder.push(current);

      while (pool.length > 0) {
        let bestI = 0, bDist = Infinity;
        for (let i = 0; i < pool.length; i++) {
          const d = (await getFootDistance(current, pool[i])).distance;
          if (d < bDist) { bDist = d; bestI = i; }
        }
        const next = pool.splice(bestI, 1)[0];
        bestOrder.push(next);
        current = next;
      }
    }

    city.pois = [...bestOrder, ...inactiveOrVisited];
    const origin = startOrigin || bestOrder[0];
    const subRoute = startOrigin ? bestOrder : bestOrder.slice(1);
    const metrics = await calculateTotalPathWithEnd(origin, subRoute, returnTarget);
    
    let info = `Route optimiert (${bestOrder.length} Orte)! Gesamtweg: ${(metrics.totalDist / 1000).toFixed(2)} km (~${metrics.totalDur} Min.)`;
    if (returnTarget) info += ` inkl. Rückkehr zu "${returnTarget.name}"`;
    document.getElementById('status').innerText = info;

    render();
  }

  async function render() {
    if (!data) return;
    populateCitySelector();
    const city = getActiveCity();
    const list = document.getElementById('poi-list');
    
    if (!city || city.pois.length === 0) {
      list.innerHTML = '<li><em>Keine Orte in dieser Stadt eingetragen.</em></li>';
      document.getElementById('suggestion-content').innerHTML = 'Bitte Orte im Admin-Bereich anlegen.';
      return;
    }

    if (!currentPos) {
      currentPos = { lat: city.pois[0].lat, lng: city.pois[0].lng };
    }

    list.innerHTML = '<li>Lade Distanzen...</li>';
    const distances = await Promise.all(city.pois.map(p => getFootDistance(currentPos, p)));

    list.innerHTML = '';

    // 1. Startpunkt (Aktuelle Position) ganz oben in der Liste
    const startLi = document.createElement('li');
    startLi.className = `start-item ${!currentPosEnabled ? 'disabled-item' : ''}`;
    startLi.innerHTML = `
      <div>
        <strong>🚀 Start: Aktuelle Position</strong>
        <span class="badge ${currentPosEnabled ? '' : 'badge-disabled'}">${currentPosEnabled ? 'Start aktiv' : 'Pausiert'}</span>
        <div class="metric-info">
          GPS: ${currentPos.lat.toFixed(4)}, ${currentPos.lng.toFixed(4)}
        </div>
      </div>
      <div class="action-group">
        <button class="small ${currentPosEnabled ? 'toggle-active' : 'toggle-inactive'}" onclick="toggleCurrentPos()">
          ${currentPosEnabled ? '👁 Aktiv' : '⏸ Pausiert'}
        </button>
      </div>
    `;
    list.appendChild(startLi);

    // 2. Reguläre POIs
    city.pois.forEach((poi, index) => {
      const isEnabled = poi.enabled !== false;
      const distInfo = distances[index];
      const li = document.createElement('li');
      li.className = `${poi.visited ? 'visited' : ''} ${!isEnabled ? 'disabled-item' : ''}`;
      
      li.innerHTML = `
        <div>
          <strong>${index + 1}. ${poi.name}</strong>
          ${!isEnabled ? '<span class="badge badge-disabled">Pausiert</span>' : ''}
          <div class="metric-info">
            ${isEnabled ? `${distInfo.distance} m ab aktuellem GPS (~${distInfo.duration} Min.) • <em>${distInfo.type}</em>` : '<em>In Route deaktiviert</em>'}
          </div>
        </div>
        <div class="action-group">
          <button class="small ${isEnabled ? 'toggle-active' : 'toggle-inactive'}" 
                  onclick="togglePoiEnabled(${poi.id})" 
                  title="${isEnabled ? 'Aus Route ausschließen' : 'In Route einschließen'}">
            ${isEnabled ? '👁 Aktiv' : '⏸ Pausiert'}
          </button>
          ${!poi.visited ? `<button class="success small" onclick="markVisited(${poi.id})" title="Als besucht markieren">✓</button>` : ''}
        </div>
      `;
      list.appendChild(li);
    });

    // 3. Gemerkter Rückkehrpunkt ganz unten
    if (startPoint) {
      const isEnabled = startPoint.enabled !== false;
      const endDist = await getFootDistance(currentPos, startPoint);
      const endLi = document.createElement('li');
      endLi.className = `start-endpoint ${!isEnabled ? 'disabled-item' : ''}`;
      endLi.innerHTML = `
        <div>
          <strong>🏁 Ziel / Rückkehr: ${startPoint.name}</strong>
          <span class="badge ${isEnabled ? '' : 'badge-disabled'}">${isEnabled ? 'Aktiv' : 'Pausiert'}</span>
          <div class="metric-info">
            ${isEnabled ? `${endDist.distance} m direkte Distanz ab GPS (~${endDist.duration} Min.)` : '<em>Rückkehr nicht in Route</em>'}
          </div>
        </div>
        <div class="action-group">
          <button class="small ${isEnabled ? 'toggle-active' : 'toggle-inactive'}" onclick="toggleStartPoint()">
            ${isEnabled ? '👁 Aktiv' : '⏸ Pausiert'}
          </button>
          <button class="danger-small" onclick="clearStartPoint()" title="Löschen">✕</button>
        </div>
      `;
      list.appendChild(endLi);
    }

    await updateSuggestions();
  }

  async function updateSuggestions() {
    const city = getActiveCity();
    const unvisitedActive = city.pois.filter(p => !p.visited && p.enabled !== false);
    const container = document.getElementById('suggestion-content');
    const isReturnActive = startPoint && startPoint.enabled !== false;

    if (unvisitedActive.length === 0) {
      if (isReturnActive) {
        const dHome = await getFootDistance(currentPos, startPoint);
        const homeUrl = `https://www.google.com/maps/dir/?api=1&origin=${currentPos.lat},${currentPos.lng}&destination=${startPoint.lat},${startPoint.lng}&travelmode=walking`;
        container.innerHTML = `
          <p>🎉 Alle aktiven Stationen besucht!</p>
          <p><strong>Rückweg zum Ziel:</strong> ${startPoint.name} (${dHome.distance} m, ~${dHome.duration} Min.)</p>
          <a class="nav-btn" href="${homeUrl}" target="_blank">🏨 Zurück zu ${startPoint.name} navigieren</a>
        `;
      } else {
        container.innerHTML = "🎉 Keine aktiven Stationen mehr offen.";
      }
      return;
    }

    const plannedNext = unvisitedActive[0];
    const distPlanned = await getFootDistance(currentPos, plannedNext);

    let nearest = unvisitedActive[0];
    let minDist = distPlanned.distance;
    let nearestInfo = distPlanned;

    for (let p of unvisitedActive) {
      const dInfo = await getFootDistance(currentPos, p);
      if (dInfo.distance < minDist) {
        minDist = dInfo.distance;
        nearest = p;
        nearestInfo = dInfo;
      }
    }

    const singleNavUrl = `https://www.google.com/maps/dir/?api=1&origin=${currentPos.lat},${currentPos.lng}&destination=${plannedNext.lat},${plannedNext.lng}&travelmode=walking`;

    // Multi-Stop Route für Google Maps generieren
    let fullRouteUrl = "";
    const navOrigin = currentPosEnabled ? currentPos : unvisitedActive[0];
    const navStops = currentPosEnabled ? [...unvisitedActive] : unvisitedActive.slice(1);
    
    if (isReturnActive) {
      navStops.push(startPoint);
    }

    if (navStops.length === 0) {
      fullRouteUrl = singleNavUrl;
    } else {
      // Google Maps erlaubt maximal 9-10 Wegpunkte in der URL
      const routeSlice = navStops.slice(0, 9);
      const destination = routeSlice[routeSlice.length - 1];
      const waypoints = routeSlice.slice(0, routeSlice.length - 1)
        .map(p => `${p.lat},${p.lng}`)
        .join('%7C');

      // Hier wird die URL für die Gesamttour erstellt:
      fullRouteUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(navOrigin.lat + ',' + navOrigin.lng)}&destination=${encodeURIComponent(destination.lat + ',' + destination.lng)}&waypoints=${encodeURIComponent(waypoints)}&travelmode=walking`;
    }

    // ⬇️ HIER WIRD DIE URL IN DEN BUTTON EINGESETZT ⬇️
    html += `
      <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
        <a class="nav-btn" href="${singleNavUrl}" target="_blank">🚶 Nur zum nächsten Halt navigieren</a>
        <a class="nav-btn" style="background:#007aff;" href="${fullRouteUrl}" target="_blank">${buttonLabel}</a>
      </div>
    `;

    container.innerHTML = html;
  }


  function markVisited(id) {
    const city = getActiveCity();
    const poi = city.pois.find(p => p.id === id);
    if (poi) poi.visited = true;
    render();
  }

  function resetVisitedStatus() {
    const city = getActiveCity();
    city.pois.forEach(p => {
      p.visited = false;
      p.enabled = true;
    });
    currentPosEnabled = true;
    if (startPoint) {
      startPoint.enabled = true;
      saveStartPoint();
    }
    render();
  }

  function setNext(id) {
    const city = getActiveCity();
    const idx = city.pois.findIndex(p => p.id === id);
    const [item] = city.pois.splice(idx, 1);
    const firstUnvisitedIdx = city.pois.findIndex(p => !p.visited && p.enabled !== false);
    city.pois.splice(firstUnvisitedIdx >= 0 ? firstUnvisitedIdx : 0, 0, item);
    render();
  }

  function updatePosition() {
    if (navigator.geolocation) {
      document.getElementById('status').innerText = "Standort wird ermittelt...";
      navigator.geolocation.getCurrentPosition(pos => {
        currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        document.getElementById('status').innerText = `Live-GPS aktiv (${currentPos.lat.toFixed(4)}, ${currentPos.lng.toFixed(4)})`;
        render();
      }, () => {
        document.getElementById('status').innerText = "GPS nicht verfügbar. Nutze Standardposition.";
        render();
      });
    }
  }

  loadFromGitHub();
</script>
</body>
</html>
